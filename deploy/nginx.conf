# Production reverse proxy for the Hydrocarbon Accounting SPA + API.
#
# TLS is expected to be terminated here (mount certificates and add a
# `listen 443 ssl` server) or at an upstream appliance. Either way, the API
# must only be reachable through this proxy so that client IPs and
# X-Forwarded-Proto can be trusted.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Must match backend MAX_REQUEST_BODY_BYTES (25 MB by default).
    client_max_body_size 25m;

    # Never advertise the nginx version.
    server_tokens off;

    # ---------------------------------------------------------------------
    # API
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite (never append) so a client-supplied X-Forwarded-For cannot
        # spoof the address used for throttling and the audit trail.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_request_buffering on;
        proxy_buffering on;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        # Backup/restore validation and large exports can take minutes.
        proxy_read_timeout    300s;
    }

    # ---------------------------------------------------------------------
    # Static assets (hashed filenames - safe to cache for a year)
    # ---------------------------------------------------------------------
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---------------------------------------------------------------------
    # SPA shell - never cached, so a new deployment is picked up immediately
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; media-src 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # Add these only when this listener terminates TLS:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
